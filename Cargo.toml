[package]
name = "coco-loco"
version = "0.1.0"
edition = "2021"
description = "A 2D side-scrolling action game for toddlers, starring two brothers with superpowers"
authors = ["Andre Burgstahler"]

[lib]
name = "coco_loco"
path = "src/lib.rs"

[[bin]]
name = "coco-loco"
path = "src/main.rs"

[dependencies]
bevy          = "0.15"
avian2d       = "0.2"
bevy_kira_audio = { version = "0.21", features = ["ogg"] }
rhai          = { version = "1.19", features = ["sync"] }

[dev-dependencies]

# Fast compile in dev
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
