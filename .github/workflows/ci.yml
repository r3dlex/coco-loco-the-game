name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  _check-self-hosted:
    name: "Build & Test (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (Bevy)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Check
        run: cargo check --all-targets

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  check:
    name: Build & Test
    needs: _check-self-hosted
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._check-self-hosted.outputs.passed }}"

      - uses: actions/checkout@v4
        if: needs._check-self-hosted.outputs.passed != 'true'

      - name: Install Rust toolchain
        if: needs._check-self-hosted.outputs.passed != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: needs._check-self-hosted.outputs.passed != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (Bevy)
        if: needs._check-self-hosted.outputs.passed != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Check
        if: needs._check-self-hosted.outputs.passed != 'true'
        run: cargo check --all-targets

      - name: Build
        if: needs._check-self-hosted.outputs.passed != 'true'
        run: cargo build --all-targets

      - name: Test
        if: needs._check-self-hosted.outputs.passed != 'true'
        run: cargo test --all-targets

  _coverage-self-hosted:
    name: "Coverage (85% gate) (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    needs: check
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (Bevy)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only 2>&1 | tee coverage-summary.txt
          echo "Coverage report generated. Gate will be enforced at 85% once plugin systems are fleshed out."

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  coverage:
    name: Coverage (85% gate)
    needs: [_coverage-self-hosted, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._coverage-self-hosted.outputs.passed }}"

      - uses: actions/checkout@v4
        if: needs._coverage-self-hosted.outputs.passed != 'true'

      - name: Install Rust toolchain
        if: needs._coverage-self-hosted.outputs.passed != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        if: needs._coverage-self-hosted.outputs.passed != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (Bevy)
        if: needs._coverage-self-hosted.outputs.passed != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Install cargo-llvm-cov
        if: needs._coverage-self-hosted.outputs.passed != 'true'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        if: needs._coverage-self-hosted.outputs.passed != 'true'
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only 2>&1 | tee coverage-summary.txt
          echo "Coverage report generated. Gate will be enforced at 85% once plugin systems are fleshed out."

      - name: Upload coverage artifact
        if: needs._coverage-self-hosted.outputs.passed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  _pipelines-self-hosted:
    name: "Spec Pipelines (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install pipeline runner
        run: cd tools/pipeline_runner && poetry install

      - name: Check all specs
        run: cd tools/pipeline_runner && poetry run pipeline check-all

      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  pipelines:
    name: Spec Pipelines
    needs: _pipelines-self-hosted
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._pipelines-self-hosted.outputs.passed }}"

      - uses: actions/checkout@v4
        if: needs._pipelines-self-hosted.outputs.passed != 'true'

      - name: Set up Python
        if: needs._pipelines-self-hosted.outputs.passed != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        if: needs._pipelines-self-hosted.outputs.passed != 'true'
        run: pip install poetry

      - name: Install pipeline runner
        if: needs._pipelines-self-hosted.outputs.passed != 'true'
        run: cd tools/pipeline_runner && poetry install

      - name: Check all specs
        if: needs._pipelines-self-hosted.outputs.passed != 'true'
        run: cd tools/pipeline_runner && poetry run pipeline check-all
