<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E7"/>
      <stop offset="100%" style="stop-color:#FFE4B5"/>
    </linearGradient>
    <filter id="paper3">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg3)"/>
  <!-- Book border -->
  <rect x="30" y="20" width="580" height="320" rx="8" fill="none" stroke="#8B4513" stroke-width="4"/>
  <rect x="38" y="28" width="564" height="304" rx="6" fill="none" stroke="#8B451366" stroke-width="1.5" stroke-dasharray="8,4"/>
  <!-- Decorative corner flourishes -->
  <path d="M50,45 Q65,35 80,45 Q70,55 50,45Z" fill="#8B4513" opacity="0.4"/>
  <path d="M590,45 Q575,35 560,45 Q570,55 590,45Z" fill="#8B4513" opacity="0.4"/>
  <path d="M50,315 Q65,325 80,315 Q70,305 50,315Z" fill="#8B4513" opacity="0.4"/>
  <path d="M590,315 Q575,325 560,315 Q570,305 590,315Z" fill="#8B4513" opacity="0.4"/>
  <!-- Title in warm handwritten style -->
  <text x="320" y="145" text-anchor="middle" font-family="'Georgia','Palatino',serif" font-size="72" font-style="italic" fill="#5C3317" letter-spacing="3">Coco Loco</text>
  <!-- Decorative line -->
  <line x1="160" y1="170" x2="480" y2="170" stroke="#8B4513" stroke-width="1.5" opacity="0.5"/>
  <circle cx="160" cy="170" r="3" fill="#8B4513" opacity="0.5"/>
  <circle cx="480" cy="170" r="3" fill="#8B4513" opacity="0.5"/>
  <circle cx="320" cy="170" r="4" fill="#D4A017"/>
  <!-- Subtitle -->
  <text x="320" y="210" text-anchor="middle" font-family="'Georgia','Palatino',serif" font-size="28" fill="#8B6914" letter-spacing="6">The Game</text>
  <!-- Small illustration hint: two tiny figures -->
  <circle cx="280" cy="270" r="12" fill="#FF6B35" opacity="0.7"/>
  <circle cx="280" cy="255" r="8" fill="#FFD4A0"/>
  <circle cx="360" cy="276" r="10" fill="#4ECDC4" opacity="0.7"/>
  <circle cx="360" cy="263" r="7" fill="#FFD4A0"/>
  <!-- Caption -->
  <text x="320" y="315" text-anchor="middle" font-family="'Georgia',serif" font-size="13" fill="#8B6914" opacity="0.6" font-style="italic">A tale of two brothers</text>
</svg>
