<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#1B1464"/>
      <stop offset="100%" style="stop-color:#070320"/>
    </radialGradient>
    <filter id="starGlow5">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg5)"/>
  <!-- Stars field -->
  <circle cx="50" cy="30" r="1.5" fill="#FFFFFF"/><circle cx="120" cy="80" r="1" fill="#FFFFFF99"/>
  <circle cx="200" cy="20" r="1.2" fill="#FFFFFF"/><circle cx="300" cy="50" r="0.8" fill="#FFFFFF88"/>
  <circle cx="400" cy="30" r="1.5" fill="#FFFFFF"/><circle cx="500" cy="60" r="1" fill="#FFFFFFAA"/>
  <circle cx="580" cy="25" r="1.3" fill="#FFFFFF"/><circle cx="620" cy="80" r="0.7" fill="#FFFFFF77"/>
  <circle cx="30" cy="150" r="1" fill="#FFFFFF88"/><circle cx="610" cy="180" r="1.2" fill="#FFFFFF"/>
  <circle cx="80" cy="320" r="1.5" fill="#FFFFFF"/><circle cx="200" cy="340" r="0.8" fill="#FFFFFF99"/>
  <circle cx="440" cy="330" r="1" fill="#FFFFFF"/><circle cx="560" cy="310" r="1.3" fill="#FFFFFFAA"/>
  <circle cx="350" cy="320" r="0.8" fill="#FFFFFF88"/><circle cx="150" cy="250" r="1" fill="#FFFFFF"/>
  <circle cx="490" cy="140" r="1.2" fill="#FFFFFF99"/><circle cx="250" cy="280" r="0.8" fill="#FFFFFF"/>
  <!-- Planet -->
  <circle cx="540" cy="280" r="40" fill="#4A2F7F" opacity="0.5"/>
  <ellipse cx="540" cy="280" rx="55" ry="12" fill="none" stroke="#9B59B644" stroke-width="3" transform="rotate(-20,540,280)"/>
  <!-- Title -->
  <text x="320" y="155" text-anchor="middle" font-family="'Trebuchet MS','Helvetica',sans-serif" font-size="80" font-weight="bold" fill="#E8D5FF" filter="url(#starGlow5)" letter-spacing="8">COCO</text>
  <text x="320" y="235" text-anchor="middle" font-family="'Trebuchet MS','Helvetica',sans-serif" font-size="80" font-weight="bold" fill="#7FDBFF" filter="url(#starGlow5)" letter-spacing="8">LOCO</text>
  <!-- Subtitle -->
  <text x="320" y="285" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="22" fill="#9B89B3" letter-spacing="10">THE GAME</text>
  <!-- Shooting star -->
  <line x1="80" y1="100" x2="140" y2="115" stroke="#FFE066" stroke-width="2" opacity="0.7"/>
  <circle cx="80" cy="100" r="3" fill="#FFE066" filter="url(#starGlow5)"/>
</svg>
