<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coco Loco — Logo Selector</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: 'Helvetica Neue', sans-serif; color: #fff; padding: 20px; }
  h1 { text-align: center; margin-bottom: 8px; font-size: 28px; color: #FFE066; }
  p.sub { text-align: center; margin-bottom: 24px; color: #999; font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    max-width: 1080px;
    margin: 0 auto;
  }
  .card {
    border: 3px solid transparent;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s ease;
    background: #16213e;
    position: relative;
  }
  .card:hover { border-color: #FFE066; transform: scale(1.03); }
  .card.selected { border-color: #4ECDC4; box-shadow: 0 0 20px #4ECDC444; }
  .card svg { width: 100%; display: block; }
  .card .label {
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
  }
  .card .num { color: #FFE066; font-size: 18px; }
  .card .name { color: #aaa; }
  .card .check { display: none; position: absolute; top: 8px; right: 8px; background: #4ECDC4; color: #000; border-radius: 50%; width: 28px; height: 28px; font-size: 18px; line-height: 28px; text-align: center; font-weight: bold; z-index: 2; }
  .card.selected .check { display: block; }
  #result { text-align: center; margin-top: 24px; font-size: 18px; color: #4ECDC4; min-height: 30px; }
</style>
</head>
<body>
<h1>Coco Loco: The Game</h1>
<p class="sub">Click a logo to select it</p>
<div class="grid">

<!-- 01 Playful Bubble -->
<div class="card" onclick="sel(this,'01','Playful Bubble')">
<div class="check">&#10003;</div>
<svg viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF6B35"/><stop offset="100%" stop-color="#F7C948"/></linearGradient>
    <filter id="s1"><feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#00000044"/></filter>
    <filter id="g1"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="360" rx="30" fill="url(#bg1)"/>
  <circle cx="80" cy="60" r="25" fill="#FFFFFF22"/><circle cx="560" cy="80" r="35" fill="#FFFFFF22"/>
  <circle cx="150" cy="300" r="20" fill="#FFFFFF22"/><circle cx="500" cy="290" r="28" fill="#FFFFFF22"/>
  <circle cx="320" cy="40" r="15" fill="#FFFFFF33"/>
  <text x="100" y="140" font-size="40" fill="#FFE066" filter="url(#g1)">&#9733;</text>
  <text x="520" y="160" font-size="35" fill="#FFE066" filter="url(#g1)">&#9733;</text>
  <text x="320" y="170" text-anchor="middle" font-family="Comic Sans MS,Chalkboard SE,cursive" font-size="82" font-weight="bold" fill="#FFFFFF" stroke="#D4451A" stroke-width="4" filter="url(#s1)">COCO LOCO</text>
  <text x="320" y="230" text-anchor="middle" font-family="Comic Sans MS,cursive" font-size="32" fill="#FFFFFF" stroke="#D4451A" stroke-width="2" letter-spacing="8" filter="url(#s1)">THE GAME</text>
  <text x="320" y="310" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="16" fill="#FFF3D0" opacity="0.8">Two Brothers. One Wild Adventure.</text>
</svg>
<div class="label"><span class="num">01</span><span class="name">Playful Bubble</span></div>
</div>

  <text x="320" y="280" text-anchor="middle" font-family="Courier New,monospace" font-size="18" fill="#00FFFF" letter-spacing="12">THE GAME</text>

<div class="label"><span class="num">02</span><span class="name">Retro Arcade</span></div>
</div>

<script>
function sel(el,id,name){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('result').textContent='Selected: #'+id+' — '+name;
}
</script>
