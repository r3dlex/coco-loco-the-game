<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- Dark background variant for use on dark surfaces -->
  <defs>
    <linearGradient id="dbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C1810"/>
      <stop offset="100%" stop-color="#1A0E08"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#dbg)"/>
  <!-- Book border (lighter for contrast) -->
  <rect x="30" y="20" width="580" height="320" rx="8" fill="none" stroke="#C4883A" stroke-width="4"/>
  <rect x="38" y="28" width="564" height="304" rx="6" fill="none" stroke="#C4883A44" stroke-width="1.5" stroke-dasharray="8,4"/>
  <!-- Corner flourishes -->
  <path d="M50,45 Q65,35 80,45 Q70,55 50,45Z" fill="#C4883A" opacity="0.4"/>
  <path d="M590,45 Q575,35 560,45 Q570,55 590,45Z" fill="#C4883A" opacity="0.4"/>
  <path d="M50,315 Q65,325 80,315 Q70,305 50,315Z" fill="#C4883A" opacity="0.4"/>
  <path d="M590,315 Q575,325 560,315 Q570,305 590,315Z" fill="#C4883A" opacity="0.4"/>
  <!-- Title -->
  <text x="320" y="145" text-anchor="middle" font-family="Georgia,Palatino,serif" font-size="72" font-style="italic" fill="#FFE4B5" letter-spacing="3">Coco Loco</text>
  <!-- Decorative line -->
  <line x1="160" y1="170" x2="480" y2="170" stroke="#C4883A" stroke-width="1.5" opacity="0.5"/>
  <circle cx="160" cy="170" r="3" fill="#C4883A" opacity="0.5"/>
  <circle cx="480" cy="170" r="3" fill="#C4883A" opacity="0.5"/>
  <circle cx="320" cy="170" r="4" fill="#FFD700"/>
  <!-- Subtitle -->
  <text x="320" y="210" text-anchor="middle" font-family="Georgia,Palatino,serif" font-size="28" fill="#D4A860" letter-spacing="6">The Game</text>
  <!-- Character figures -->
  <circle cx="280" cy="270" r="12" fill="#FF6B35" opacity="0.8"/>
  <circle cx="280" cy="255" r="8" fill="#FFD4A0"/>
  <circle cx="360" cy="276" r="10" fill="#4ECDC4" opacity="0.8"/>
  <circle cx="360" cy="263" r="7" fill="#FFD4A0"/>
  <!-- Caption -->
  <text x="320" y="315" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#D4A860" opacity="0.5" font-style="italic">A tale of two brothers</text>
</svg>
