<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <radialGradient id="bg8" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="40%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </radialGradient>
    <filter id="power8">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shake8">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFFFFF66"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg8)"/>
  <!-- Energy rays -->
  <g opacity="0.3">
    <line x1="320" y1="180" x2="0" y2="0" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="320" y1="180" x2="640" y2="0" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="320" y1="180" x2="0" y2="360" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="320" y1="180" x2="640" y2="360" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="320" y1="180" x2="320" y2="0" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="320" y1="180" x2="0" y2="180" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="320" y1="180" x2="640" y2="180" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="320" y1="180" x2="320" y2="360" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <!-- Power circle -->
  <circle cx="320" cy="180" r="120" fill="none" stroke="#FFFFFF44" stroke-width="3"/>
  <circle cx="320" cy="180" r="140" fill="none" stroke="#FFFFFF22" stroke-width="2"/>
  <!-- Star meter icons -->
  <g transform="translate(190,85)">
    <text font-size="30" fill="#FFFFFF" filter="url(#power8)">★ ★ ★ ★ ★</text>
  </g>
  <!-- Title — DOUBLE TROUBLE style -->
  <text x="320" y="170" text-anchor="middle" font-family="'Impact','Arial Black',sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" filter="url(#shake8)" letter-spacing="4">COCO LOCO</text>
  <!-- Subtitle -->
  <text x="320" y="220" text-anchor="middle" font-family="'Impact',sans-serif" font-size="30" fill="#FFE066" letter-spacing="6">THE GAME</text>
  <!-- DOUBLE TROUBLE badge -->
  <rect x="210" y="250" width="220" height="36" rx="18" fill="#FFFFFF22" stroke="#FFE066" stroke-width="2"/>
  <text x="320" y="275" text-anchor="middle" font-family="'Impact',sans-serif" font-size="18" fill="#FFE066" letter-spacing="3">DOUBLE TROUBLE</text>
</svg>
