  <text x="320" y="250" text-anchor="middle" font-family="'Comic Sans MS','Chalkboard SE',cursive" font-size="88" font-weight="bold" fill="#FFE066" stroke="#8B0045" stroke-width="5" filter="url(#pop4)">LOCO</text>
